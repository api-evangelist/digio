aid: digio
url: https://raw.githubusercontent.com/api-evangelist/digio/refs/heads/main/apis.yml
name: Digio
kind: company
description: Digio is an India-based digital trust and paperwork automation platform.
  Its REST APIs deliver legally-valid Aadhaar and OTP eSign, eStamping, KYC (CKYC,
  KRA, DigiLocker, offline Aadhaar, and Video KYC), eNACH/NACH eMandates and UPI
  Autopay recurring payments, AML/CFT screening, and template-based document and
  agreement management. All endpoints use HTTPS with HTTP Basic authentication.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/digio.png
tags:
