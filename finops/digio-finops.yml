providerId: digio
created: '2026-07-17'
modified: '2026-07-17'
reconciled: false
tags:
- eSign
- KYC
- eNACH
- India
- Fintech
- FinOps
- Cost Management
description: >-
  FinOps view of Digio spend. Digio bills on a transaction-metered basis under
  an enterprise contract, in Indian Rupees (INR), across eSign, eStamp, KYC,
  eNACH/NACH, UPI Autopay, and AML products. Some flows carry pass-through
  regulated costs - UIDAI fees for Aadhaar eKYC and state stamp duty for
  eStamp - in addition to Digio's facilitation fee.
notes: >-
  No public rate card; unit costs are contract-specific. Track spend per product
  and per environment (sandbox ext.digio.in vs production api.digio.in).
sources:
- https://www.digio.in/
- https://documentation.digio.in/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Digio
serviceCategory: Identity and Digital Trust
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: INR
  chargeCategories:
  - Usage
  - Purchase
  - Tax
focusColumns:
  ServiceName: Digio
  ServiceCategory: Identity and Digital Trust
  ProviderName: Digio
  PublisherName: Digio
  InvoiceIssuerName: Digio
  BillingCurrency: INR
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: esign_signatures
  description: Legally-valid electronic signatures completed (Aadhaar / OTP / DSC).
  unit: signatures
  aggregation: sum
  dimensions:
  - account
  - product
- name: estamp_documents
  description: eStamped documents; Digio facilitation fee plus pass-through state stamp duty.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - state
- name: kyc_verifications
  description: KYC verifications (Aadhaar offline, DigiLocker, CKYC, KRA, Video KYC); Aadhaar eKYC adds UIDAI fees.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - method
- name: enach_mandates
  description: eNACH / NACH mandate registrations and modifications.
  unit: mandates
  aggregation: sum
  dimensions:
  - account
  - auth_mode
- name: aml_screenings
  description: AML / CFT screening and monitoring checks.
  unit: screenings
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Reconcile Digio monthly invoices per product; separate facilitation fees from pass-through UIDAI/stamp-duty costs.
- name: Allocation
  description: Tag credentials per workload/team; segregate sandbox (ext.digio.in) and production (api.digio.in) usage.
- name: Optimization
  description: Prefer offline Aadhaar / DigiLocker KYC where a paid Aadhaar eKYC (UIDAI fee) is not required; batch document flows.
- name: Accountability
  description: Assign owners per product line; review transaction volumes against the contracted commit monthly.
maintainers:
