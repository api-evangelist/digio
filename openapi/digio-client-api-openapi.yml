        description: 'Unique ID to identify documents provided by Digio. (Format: DID************)'
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                title: success
                type: boolean
                description: Indicates if the request was successful
              examples:
                Success:
                  description: Success
                  value:
                    success: true
      security:
      - api_auth: []
      tags:
      - Client
  /v2/client/document/{docId}/cancel:
