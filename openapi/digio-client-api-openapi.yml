openapi: 3.2.0
info:
  title: Digio Client API
  description: Getting started with Digio Rest Apis
  contact:
    email: support@digio.in
servers:
- url: https://api.digio.in
  description: Server URL in Production Environment
tags:
- name: Client
paths:
  /client/form/{id}/response:
    get:
      summary: Get Forms Data Request Details API
      description: Call this API to Get Forms Data Request Details API
      operationId: getKycResponse
      parameters:
      - name: id
        in: path
        description: Unique identifier referencing a request
        required: true
        schema:
          type: string
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormExternalResponse'
      tags:
      - Client
  /client/form/request:
    post:
      summary: Create a Form Request
      operationId: requestForm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormHttpRequest'
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormExternalResponse'
      tags:
      - Client
  /client/form/{formKey}/download_data:
    get:
      summary: Get Forms Data
      description: Get Forms Data API
      operationId: getFormData
      parameters:
      - name: formKey
        in: path
        required: true
        schema:
          type: string
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
      tags:
      - Client
  /v2/client/document/upload:
