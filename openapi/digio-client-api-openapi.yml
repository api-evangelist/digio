      type: object
      properties:
        file_name:
          type: string
          description: Optional. File downloaded post signing name.
        will_self_sign:
          type: boolean
          description: Enable Delegate Signing.
        signatory:
          type: string
          description: Email address of authorized signatory of business, will_self_sign should to true to delegate sign.
        expire_in_days:
          maximum: 90
          minimum: 1
          type: integer
          description: Request expiry in days
          format: int32
          default: 10
        callback:
          type: string
          description: "Unique ID to be passed by you for the document (for idempotency). \nNote: Please use this with Unique Callback Id per document. If same callback Id is passed in the request, it’ll be considered duplicate request and information about previous document will be returned.\n"
        comment:
          type: string
          description: Message/Notes to be sent to the signing parties
        display_on_page:
          type: string
          description: Signature display on page - first/last/all/custom     (default is first). Pass “custom” if you are using sign_coordinates
          enum:
          - first
          - last
          - all
          - custom
          default: first
        sign_coordinates:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              description: "Customized placing of signature.\n Sample input : \n\"sign_coordinates\":{ \"xyz@abc.com\":{ \"1\":[{ \"llx\":315,\"lly\":20, \"urx\":455,\"ury\":60}]}}\nMap of signer identifiers. Each identifier points to a map of page no. Each page no. points to array of signature coordinates"
              items:
                $ref: '#/components/schemas/RectCoordinates'
            description: "Customized placing of signature.\n Sample input : \n\"sign_coordinates\":{ \"xyz@abc.com\":{ \"1\":[{ \"llx\":315,\"lly\":20, \"urx\":455,\"ury\":60}]}}\nMap of signer identifiers. Each identifier points to a map of page no. Each page no. points to array of signature coordinates"
          description: "Customized placing of signature.\n Sample input : \n\"sign_coordinates\":{ \"xyz@abc.com\":{ \"1\":[{ \"llx\":315,\"lly\":20, \"urx\":455,\"ury\":60}]}}\nMap of signer identifiers. Each identifier points to a map of page no. Each page no. points to array of signature coordinates"
        notify_signers:
          type: boolean
          description: Sends an email/SMS to signers once document uploaded & signature request is created for signers
        customer_notification_mode:
          type: string
          description: Sends an SMS/Whatsapp notification if the identifier is mobile number
          enum:
          - SMS
          - WHATSAPP
          - ALL
          - EMAIL
          default: SMS
        signature_type:
          type: string
          enum:
          - dsc
          - aadhaar
          - external
          - external_sign
          - aadhaar_with_dependents
          - electronic_with_dependents
          - electronic
          - document_review
        fallback_sign_types:
          type: array
          description: Alternate sign types every signer is allowed to switch to, in case signing with signature_type could not be completed. Can be overridden per signer using fallback_sign_types inside the signers object.
          items:
            $ref: '#/components/schemas/FallbackSignType'
        switch_after_failures:
          minimum: 1
          type: integer
          description: Number of failed signing attempts after which a signer may move to one of the fallback_sign_types. Defaults to 1.
          format: int32
          default: 1
        estamp_request:
          $ref: '#/components/schemas/MergeEstampRequest'
        custom_reference:
          type: string
          description: Custom reference text to be printed on document instead of the default stamp reference. If not provided, defaults to 'Stamp Reference#<stampIds>'
        reference_position:
          type: string
          description: Position of the reference text on the document. TOP prints horizontally at the top; LEFT and RIGHT print vertically along the respective side. Defaults to TOP.
          enum:
          - TOP
          - LEFT
          - RIGHT
          default: TOP
        generate_access_token:
          type: boolean
          description: If true, will receive an access_token object in response. access_token used to bypass first factor authentication in SDKs.
          default: false
        post_signing_receivers:
          maxLength: 5
          type: array
          description: Recipients (other than the signers or organization) with whom the signed document should be shared. Only email addresses are supported as identifiers; mobile numbers are not supported. Max 5 receivers.
          items:
            $ref: '#/components/schemas/AbstractSigner'
