        constitution_type:
          type: string
          description: 'Type of constitution (e.g., Individual, Company).


            Allowed values:


            01 - Individual (Type: Individual)


            A - Sole Proprietorship (Type: Legal Entity / Other than Individual)


            B - Partnership Firm (Type: Legal Entity / Other than Individual)


            C - HUF (Type: Legal Entity / Other than Individual)


            D - Private Limited Company (Type: Legal Entity / Other than Individual)


            E - Public Limited Company (Type: Legal Entity / Other than Individual)


            F - Society (Type: Legal Entity / Other than Individual)


            G - Association of Persons (AOP)/ Body of Individuals (BOI) (Type: Legal Entity / Other than Individual)


            H - Trust (Type: Legal Entity / Other than Individual)


            I - Liquidator (Type: Legal Entity / Other than Individual)


            J - Limited Liability Partnership (Type: Legal Entity / Other than Individual)


