          - WHATSAPP
          - ALL
          - EMAIL
          default: SMS
        expireInDays:
          type: integer
          description: 'expire In Days . Default: 10 days'
          format: int32
        formKey:
          maxLength: 100
          minLength: 0
          pattern: ^[^<>";=%!\*+?]*$
          type: string
          description: Unique identifier referring to form template to be used while creating the request
        generateDocument:
          type: boolean
          description: Set to true, if a document template is configured to the form or else set “false”
