                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDocDetails'
      security:
      - api_auth: []
      tags:
      - Client
  /v2/client/document/download:
    get:
      summary: Download document
      operationId: downloadDocument
      parameters:
      - name: document_id
        in: query
        description: 'Unique ID to identify documents provided by Digio. (Format: DID************)'
        schema:
          type: string
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          description: Successfully downloaded the document
          content:
            '*/*':
              schema:
                type: file
                description: Pdf File
                format: byte
              examples:
                file:
                  description: file
                  value: Pdf File
      security:
      - api_auth: []
      tags:
      - Client
