          type: boolean
          description: Pass false if its a one-time debit<br>
          default: false
        frequency:
          type: string
          description: 'If is_recurring : true, pass debit frequency. <br>Note: Choose one from below, commensurate with your use case category (management category) eg: L001 (Loan Installment should have a defined frequency that is commensurate with the EMI schedule agreed upon with the customer eg: Monthly). Incorrect frequency passed for a management category, may lead to mandate registration failure and is at the destination bank''s discretion.'
          enum:
          - Adhoc
          - IntraDay
          - Daily
          - Weekly
          - Monthly
          - BiMonthly
          - Quarterly
          - Semiannually
          - Yearly
        first_collection_date:
          type: string
          description: Date for First Debit in yyyy-mm-dd ; means the date from which you want the mandate to be registered
          format: date-time
        final_collection_date:
          type: string
          description: 'Date for Last Debit in yyyy-mm-dd<br>Maximum allowed limit for final_collection_date is 30 yrs .<br><br>Note: If Final collection date is not passed then DIGIO will set this to default 30 yrs <br>'
          format: date-time
        collection_amount:
          maximum: 10000000
          minimum: 1
          type: number
          description: 'This is for fixed amount mandate EMI amount eg: 5500.50<br>Note: Mandate amount limit is 1,00,00,000 for physical/API/Esign mandate variant as per Circular No. NACH/2023-24/NACH/003 w.e.f. 15 Sep, 2023<br>Either of collection_amount or maximum_amount is mandatory<br>'
        maximum_amount:
          maximum: 10000000
          minimum: 1
          type: number
          description: 'Maximum amount that may be collected from the customer''s account, per instruction eg: 5500.50<br>Note: Mandate amount limit is 1,00,00,000 for physical/API/Esign mandate variant as per Circular No. NACH/2023-24/NACH/003 w.e.f. 15 Sep, 2023<br>Either of collection_amount or maximum_amount is mandatory<br>'
        customer_name:
          maxLength: 40
          minLength: 0
          pattern: ^[0-9A-Za-z]{1,}[0-9A-Za-z\s.']{0,}$
          type: string
          description: Recommended that the name is same as per Destination Bank records.
        scheme_ref_number:
          maxLength: 20
          pattern: ^[0-9A-Za-z]{0,}$
          type: string
          description: 'Additional Reference number maintained by Corporate for the reconciliation <br>E.g:  Loan account number, Folio number, Insurance policy number etc <br>ALPHANUMERIC allowed. <br>'
        customer_mobile:
          maxLength: 13
          minLength: 0
          type: string
          description: Customer Mobile number
        customer_email:
          maxLength: 50
          minLength: 0
          type: string
          description: Customer Email address
        customer_account_number:
          maxLength: 18
          minLength: 8
          type: string
          description: Customer bank account number. Should be all numeric<br>
        customer_account_type:
          type: string
          description: 'Note: CC/NRI/Joint not supported '
          enum:
          - SAVINGS
          - CURRENT
          - OTHER
        pg_bank_ref_number:
          maxLength: 25
          type: string
          description: 'Additional bank payment reference number maintained by mutual fund corporate for the MUT payment recon <br>E.g:  PG Bank payment reference number<br>'
        investor_ref_number:
          maxLength: 10
          type: string
          description: 'Additional client/customer number maintained by Corporate for identification of mutual fund investor <br>E.g:  Client Number of mutual fund broker <br>ALPHANUMERIC allowed. <br>'
      description: Data attributes of mandate.
