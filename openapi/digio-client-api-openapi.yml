        signingConditionRequest:
          $ref: '#/components/schemas/SigningConditionRequest'
        formRequestId:
          type: string
        signCoordinates:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/RectCoordinates'
        firstSigner:
          $ref: '#/components/schemas/Signer'
      example:
        customer_identifier: dinesh@digio.in
        reference_id: CRN122306114425315NN
        notify_customer: true
        transaction_id: CRN122306114425315NN
        form_key: Some form
        generate_document: true
