    post:
      summary: CKYC Download API
      description: '**For Request Type - 1**


        If users provide the 6-digit OTP in OTP tag and Y in Validate tag CKYC API will validate the OTP and provide the response accordingly. Only 3 invalid attempts will be permitted.


        If an empty value is provided in the OTP tag, then CKYC system will retrigger OTP provided the number of attempts is not exhausted (3 attempts allowed). Resend OTP option will enable only post 90 seconds. If RE tries to resend OTP before 90 seconds, then the RE will get the error message “Resend OTP will be enabled after 90s from first request”. CKYC system will retrigger OTP provided the number of attempts is not exhausted (3 attempts)


        **For Request Type - 2**


        Get OTP is required only for Individuals. For Legal Entity, please use download API directly with the request body as below'
      operationId: downloadCkycData
      requestBody:
        content:
          application/json:
            schema:
              type: string
              oneOf:
              - $ref: '#/components/schemas/CkycValidateOtp'
              - $ref: '#/components/schemas/CkycDownloadRequestV4'
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CkycDownloadResponse'
              examples:
