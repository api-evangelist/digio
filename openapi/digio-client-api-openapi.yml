          type: string
          description: "Reference number maintained by Corporate \ne.g.: Customer_id, Loan account number, Folio number, Insurance policy number etc\nALPHA and NUMERIC allowed\n"
        scheme_ref_number:
          maxLength: 20
          type: string
          description: "Additional Reference number maintained by Corporate \nE.g:  Loan account number, Folio number, Insurance policy number etc\nALPHA and NUMERIC allowed\n"
        is_recurring:
          type: boolean
        frequency:
          type: string
          description: "If is_recurring : true, pass debit frequency. \nNote : Please pass it as ADHOC as we have to do a 1 Rupee auto debit on the same day"
          enum:
          - ADHO
          - INDA
          - DAIL
          - WEEK
          - MNTH
          - QURT
          - MIAN
          - YEAR
          - ONETIME
          - BIMN
          - adhoc
          - daily
          - weekly
          - monthly
          - bimonthly
          - quarterly
          - semiannually
          - yearly
        mandate_creation_date_time:
          type: string
          format: date-time
        first_collection_date:
          type: string
          description: ' Date for First Debit in yyyy-mm-dd ; means the date from which you want the mandate to be registered

            Note : Ideally it should be the current date on which the mandate is created. So auto debit can be successful'
          format: date-time
        final_collection_date:
          type: string
          description: Date for Last Debit in yyyy-mm-dd
          format: date-time
        collection_amount:
          type: number
        maximum_amount:
          type: number
          description: "Maximum amount that may be collected from the customer's account, per instruction\neg: 4500.50\n\nNote: \nEither of collection_amount or maximum_amount is mandatory\n"
        mandate_type:
          type: string
          enum:
          - CREATE
          - AMEND
          - CANCEL
        auth_type:
          type: string
          enum:
          - api
          - esign
          - physical
          - any
          - upi
        generate_access_token:
          type: boolean
          description: if you need an access token then pass this parameter. If allowed for other input details, will receive an access_token object in response
          default: false
        reminder:
          type: array
          items:
            type: integer
            format: int32
        instrument_type:
          type: string
          description: 'Note: Currently, Product allows only Debit'
          enum:
          - debit
          - credit
          - debit
          - credit
        notify_customer:
          type: boolean
          description: Set true to send notification to customer with a gateway link to authenticate/sign the mandate. Else, false
        customer_notification_mode:
          type: string
          description: Sends an SMS/Whatsapp notification if the identifier is mobile number
          enum:
          - SMS
          - WHATSAPP
          - ALL
          - EMAIL
          default: SMS
        comment:
          type: string
        narration:
          type: string
        corporate_config_id:
          type: string
          description: 'Please reach out to support@digio.in , in case you don’t have one. The corporate config id can be found in dashboard Login>Mandate book>utilities > manage bank profiles.

            '
        expire_in_days:
          type: integer
          description: Please pass this value to allow the end user to be able to submit the mandate image (in case of physical mandate) or perform eSign authentication within ‘X’ days. X you can pass as the value
          format: int32
          default: 10
        account_validation:
          type: boolean
          description: Default false,pass true if mandate should be auto revoked in case the customer’s account number shared by merchant in “customer_account_number” is different then the account number used by customer to authenticate the UPI mandate.
        block_fund:
          type: boolean
        revocable:
          type: boolean
        customer_account_number:
          maxLength: 34
          minLength: 0
          type: string
          description: 'Customer bank account number

            All numeric

            '
        destination_bank_id:
          maxLength: 11
          minLength: 1
          type: string
        auto_debit_amount_in_paise:
          type: integer
          description: 'Default 100 ( 1 Rs Auto Debit)

            Note: Only applicable in case auto debit amount needs to be customized. It should be less than maximum_amount'
          format: int32
        auto_debit_refund:
          type: boolean
          description: Optional. Overrides corporate config auto_debit_refund for THIS mandate. true = refund the auto-debit, false = keep it, omit = use corporate config.
        sub_user_identifier:
          type: string
        include_authentication_url:
          type: boolean
          description: Pass True if authentication link is required in response payload based on above customer’s identifier
          enum:
          - true
          - false
        external_ref_number:
          type: string
          description: 'For MUT case: NSE MANDATE ID TO BE PASSED BY CORPORATE'
        pg_bank_ref_number:
          type: string
          description: 'For MUT case: Bank reference number to be passed by corporate'
        investor_ref_number:
