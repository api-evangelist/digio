          items:
            $ref: '#/components/schemas/Signer'
        sequential:
          type: boolean
          description: In multiparty signing, sequence outlines the order in which each involved party should sign the document.
          default: false
        send_sign_link:
          type: boolean
          description: Send direct signing link over email or sms. Default false.
        file_data:
          type: string
          description: Base 64 value of pdf doc
        require_full_document_review:
          type: boolean
        templates:
          type: array
          description: Templates
          items:
            $ref: '#/components/schemas/GenerateDocsFromTemplatesAndMerge'
        pdf_file_content:
          type: object
          additionalProperties:
            type: string
