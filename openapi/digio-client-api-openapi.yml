      summary: Download audit trail
      operationId: getDocumentAuditLogV2
      parameters:
      - name: doc_id
        in: path
        description: 'Unique ID to identify documents provided by Digio. (Format: DID************)'
        required: true
        schema:
          type: string
      responses:
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Forbidden:
                  description: Forbidden
                  value:
                    details: EX2405131221289331CZ
                    code: UNAUTHORIZED_ACCESS
                    message: You are not authorized to take this action!
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Not found:
                  description: Not found
                  value:
                    details: EX240513121802065SHL
                    code: ENTITY_NOT_FOUND
                    message: 'Entity not found for this id '
        200:
          description: Successfully downloaded the audit trail
          content:
            '*/*':
              schema:
                type: file
                description: Pdf File
                format: byte
              examples:
                file:
                  description: file
                  value: Pdf File
      security:
      - api_auth: []
      tags:
      - Client
