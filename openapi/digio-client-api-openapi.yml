      parameters:
      - name: file_name
        in: query
        schema:
          type: string
      - name: method
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              example:
              - template_key: 'Template ID value from digio dashboard '
                template_values:
                  sub_end_dt: 31/12/1899
                  sys_year: '2018'
                  sys_month: '9'
                  sys_date: 20/9/2018
                  sc_ltla: NA
                  subv_flag: N
                images:
                  customer_photo:
                    content: BASE64 of input image
                    length: 100000
                    width: 100000
                    type: JPEG/PNG
              - template_key: Template ID value from digio dashboard
                template_values:
                  user_name: test 2
                  user_add: 2 M.G. Road, Bangalore 560001
              items:
                $ref: '#/components/schemas/GenerateDocsFromTemplatesAndMerge'
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    details: EX23297402937402
                    code: REQUEST_VALIDATION_FAILED
                    message: Request Validation Failed
