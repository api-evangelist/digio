            description: "Customized placing of signature.\n Sample input : \n\"sign_coordinates\":{ \"xyz@abc.com\":{ \"1\":[{ \"llx\":315,\"lly\":20, \"urx\":455,\"ury\":60}]}}\nMap of signer identifiers. Each identifier points to a map of page no. Each page no. points to array of signature coordinates"
          description: "Customized placing of signature.\n Sample input : \n\"sign_coordinates\":{ \"xyz@abc.com\":{ \"1\":[{ \"llx\":315,\"lly\":20, \"urx\":455,\"ury\":60}]}}\nMap of signer identifiers. Each identifier points to a map of page no. Each page no. points to array of signature coordinates"
        notify_signers:
          type: boolean
          description: Sends an email/SMS to signers once document uploaded & signature request is created for signers
        customer_notification_mode:
          type: string
          description: Sends an SMS/Whatsapp notification if the identifier is mobile number
          enum:
          - SMS
          - WHATSAPP
          - ALL
          - EMAIL
          default: SMS
        signature_type:
          type: string
          enum:
          - dsc
          - aadhaar
          - external
          - external_sign
          - aadhaar_with_dependents
          - electronic_with_dependents
          - electronic
          - document_review
        fallback_sign_types:
          type: array
          description: Alternate sign types every signer is allowed to switch to, in case signing with signature_type could not be completed. Can be overridden per signer using fallback_sign_types inside the signers object.
          items:
            $ref: '#/components/schemas/FallbackSignType'
        switch_after_failures:
          minimum: 1
          type: integer
          description: Number of failed signing attempts after which a signer may move to one of the fallback_sign_types. Defaults to 1.
          format: int32
          default: 1
        estamp_request:
          $ref: '#/components/schemas/MergeEstampRequest'
        custom_reference:
          type: string
          description: Custom reference text to be printed on document instead of the default stamp reference. If not provided, defaults to 'Stamp Reference#<stampIds>'
        reference_position:
          type: string
          description: Position of the reference text on the document. TOP prints horizontally at the top; LEFT and RIGHT print vertically along the respective side. Defaults to TOP.
          enum:
          - TOP
          - LEFT
          - RIGHT
          default: TOP
        generate_access_token:
          type: boolean
          description: If true, will receive an access_token object in response. access_token used to bypass first factor authentication in SDKs.
          default: false
        post_signing_receivers:
          maxLength: 5
          type: array
          description: Recipients (other than the signers or organization) with whom the signed document should be shared. Only email addresses are supported as identifiers; mobile numbers are not supported. Max 5 receivers.
          items:
            $ref: '#/components/schemas/AbstractSigner'
        signature_verification:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ValidationRuleSet'
          description: (Optional) Represents the overall signature verification configuration
        signing_condition_request:
          $ref: '#/components/schemas/SigningConditionRequest'
        include_authentication_url:
          type: boolean
          description: Pass True if authentication link is required in response payload based on above customer’s identifier
        reference_id:
          type: string
        signers:
          type: array
          description: Array of signer objects
          items:
            $ref: '#/components/schemas/Signer'
        sequential:
          type: boolean
          description: In multiparty signing, sequence outlines the order in which each involved party should sign the document.
          default: false
        send_sign_link:
          type: boolean
          description: Send direct signing link over email or sms. Default false.
        file_data:
          type: string
          description: Base 64 value of pdf doc
        require_full_document_review:
          type: boolean
        templates:
          type: array
          description: Templates
          items:
            $ref: '#/components/schemas/GenerateDocsFromTemplatesAndMerge'
      example:
        signers:
        - identifier: signer1_identifier
          name: signer1_name
          sign_type: electronic
          signer_tag: Generic name of signer1
        expire_in_days: 10
        generate_access_token: true
        send_sign_link: true
        notify_signers: true
        file_name: test.pdf
        templates:
        - template_key: TMP************
          template_values:
            variable_name: variable value
          images:
            image_variable_name:
              content: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+P+/HgAFhAJ/wlseKgAAAABJRU5ErkJggg==
              type: PNG
        - template_key: TMP*****
          template_values: {}
