    KycTemplateRequest:
      required:
      - customer_identifier
      - notify_customer
      - template_name
      type: object
      properties:
        customer_identifier:
          type: string
          description: Email/mobile phone number of the customer to which the KYC request is sent.
        notify_customer:
          type: boolean
          description: If true, a notification is sent to the customer on their email/mobile phone.
        customer_notification_mode:
          type: string
          description: Sends an SMS/Whatsapp notification if the identifier is mobile number
          enum:
          - SMS
          - WHATSAPP
          - ALL
          - EMAIL
          default: SMS
        customer_name:
          pattern: ^[0-9A-Za-z\/&\-\s.]{0,}$
          type: string
          description: 'Name of the customer. Max length: 100'
        reference_id:
          pattern: ^[0-9A-Za-z\_\-\/]{0,}$
          type: string
          description: Customer reference number (underscore or alphanumeric string supported). If not passed, one will be auto generated by Digio
        transaction_id:
          pattern: ^[0-9A-Za-z\_\-\/]{0,}$
          type: string
          description: Unique identifier referring to transaction (underscore or alphanumeric string supported). If not passed, one will be auto generated by Digio
        template_name:
          maxLength: 100
          minLength: 1
          pattern: ^[^<>";=%!\*+?]*$
          type: string
          description: Name of KYC template created over dashboard to be used while creating the request.
        preset_values:
          type: object
          additionalProperties:
            type: string
        preset_table_values:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: string
        digilocker_document_attributes:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              description: Attributes using which additional documents can be fetched from digilocker(Not applicable for AADHAAR). E.g {"PAN":{"pan_number":"ABCDEF123","name":"Test name"}})
            description: Attributes using which additional documents can be fetched from digilocker(Not applicable for AADHAAR). E.g {"PAN":{"pan_number":"ABCDEF123","name":"Test name"}})
          description: Attributes using which additional documents can be fetched from digilocker(Not applicable for AADHAAR). E.g {"PAN":{"pan_number":"ABCDEF123","name":"Test name"}})
        digilocker_preferred_flow:
          type: string
          description: Attributes using which additional documents can be fetched from digilocker(Not applicable for AADHAAR). E.g {"PAN":{"pan_number":"ABCDEF123","name":"Test name"}})
          enum:
          - PINLESS
          - DEFAULT
          - CAPTCHALESS
        expire_in_days:
          maximum: 90
          minimum: 1
          type: integer
          description: 'Request Expiry in number of days => Default: 10 days'
          format: int32
          default: 10
        message:
          pattern: ^[^<>";=%!\*+?]*$
          type: string
        reminder:
          type: array
          items:
            type: integer
            format: int32
        other_signers:
          type: array
          items:
            $ref: '#/components/schemas/Signer'
        estamp_request:
          $ref: '#/components/schemas/MergeEstampRequest'
        generate_access_token:
          type: boolean
          description: Default false, if you need an access token then pass this. If allowed for other input details, will receive an access_token object in response(For SDKs only).
        rpd_config_id:
          type: string
        collection_amount:
          type: string
        estamp_tags:
          type: object
          additionalProperties:
            type: integer
            format: int32
        request_priority:
          type: string
          enum:
          - P1
          - P2
          - P3
        generate_deeplink_info:
          type: boolean
      example:
        customer_identifier: someone@gmail.in
        customer_name: Abhishek
        template_name: DIGILOCKER_AADHAAR_PAN
        notify_customer: true
        expire_in_days: 10
        generate_access_token: true
        reference_id: '1234'
        transaction_id: ABCW233
