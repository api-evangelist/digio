          type: boolean
          description: Automatically Submit the Form
        multiLanguage:
          type: boolean
          description: Enable multi Language flag
        signatureType:
          type: string
          description: Only set if generate_document is passed as true in the above request.
          enum:
          - dsc
          - aadhaar
          - external
          - external_sign
          - aadhaar_with_dependents
          - electronic_with_dependents
          - electronic
          - document_review
        signatureMode:
          type: string
          description: Only set if generate_document is passed as true in the above request.
          enum:
          - otp
          - slate
          - kyc
          - otp_certified
          - slate_certified
          - esign_3
          - esign_3s
          - nesl_aadhaar_sign
        otherSigners:
          type: array
          description: Additional signers
          items:
            $ref: '#/components/schemas/Signer'
        presetValues:
          type: object
          additionalProperties:
            type: string
            description: Default Values
          description: Default Values
        presetTableValues:
          type: object
          additionalProperties:
            type: array
            description: preset Table Values
            items:
              type: object
              additionalProperties:
                type: string
                description: preset Table Values
              description: preset Table Values
          description: preset Table Values
        generateAccessToken:
          type: boolean
          description: Conditional.Default false, if you need an access token then pass this. If allowed for other input details, will receive an access_token object in response.Used to bypass first factor authentication in SDKs.
        estampRequest:
          $ref: '#/components/schemas/MergeEstampRequest'
        estampRequests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MergeEstampRequest'
          description: merge estamp Requests
        fileName:
