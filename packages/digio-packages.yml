    registry: github
    name: digio-ios-sdk
    url: https://github.com/digio-tech/digio-ios-sdk
    install: "Add via CocoaPods / Swift Package Manager per documentation.digio.in/sdk/"
    official: true
    category: mobile-journey-sdk
  - language: swift-objc
    registry: github
    name: digio-iOS-KYC-SDK
