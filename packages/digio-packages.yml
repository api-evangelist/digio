generated: '2026-07-17'
method: searched
source: https://github.com/digio-tech
notes: >-
  Digio ships first-party CLIENT-SIDE / mobile journey SDKs (iOS, Android/Kotlin,
  React Native, Flutter, Web) from the github.com/digio-tech and github.com/digio-in
  organizations - these embed Digio KYC, eSign and eMandate journeys into host apps.
  Digio does not publish a first-party server-side API SDK on npm/PyPI/Maven; the
  npm packages "digio" and "digio-api" are THIRD-PARTY (a DigitalOcean API wrapper)
  and are excluded. Sample/demo integration apps are listed as examples, not libraries.
packages:
